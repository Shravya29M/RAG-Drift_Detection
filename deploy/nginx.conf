# Round-robin load balancer in front of the DriftGuard API replicas.
upstream driftguard {
    server api1:8000;
    server api2:8000;
    server api3:8000;
    keepalive 32;
}

server {
    listen 80;
    # /ingest uploads whole documents.
    client_max_body_size 64m;

    location / {
        proxy_pass http://driftguard;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        # Which replica served the request; the benchmark uses it to confirm
        # traffic is spread across all of them.
        add_header X-Upstream $upstream_addr always;
    }
}
