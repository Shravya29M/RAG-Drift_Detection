# All tunables for the RAG-drift pipeline. Loaded once at startup into Settings.

ingestion:
  chunk_size: 200          # embedding-model tokens per chunk; model embeds <= 254
  chunk_overlap: 30        # tokens (whole words) shared between neighbours
  supported_extensions: [".pdf", ".md", ".txt"]

embedding:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  batch_size: 64

vector_store:
  backend: "faiss"         # "faiss" | "qdrant"
  faiss_index_path: "index/faiss.index"
  qdrant_url: ""           # overridden by env QDRANT_URL
  top_k: 5
  score_threshold: 0.0     # min cosine score to include a hit

retrieval:
  top_k: 5
  rerank: false            # enable cross-encoder re-ranking
  rerank_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  no_hit_threshold: 0.3    # below this score → "no information found"

generation:
  llm_provider: "openai"   # "openai" | "anthropic"
  openai_model: "gpt-4o"
  anthropic_model: "claude-opus-4-6"
  max_tokens: 1024
  temperature: 0.2
  stream: true

drift:
  window_size: 50          # queries per drift evaluation window
  pca_components: 32       # dimensionality before KS/MMD test
  threshold_alpha: 0.05    # KS significance level (Bonferroni-corrected per dimension)
  mmd_threshold: 0.01      # MMD statistic threshold
  hysteresis_windows: 3    # consecutive alert windows before re-index
  quality_drop_ratio: 0.85 # window mean score below this fraction of baseline = stale index
  method: "ks"             # "ks" | "mmd"

scheduler:
  drift_check_interval_seconds: 30

alarm:
  webhook_url: ""          # overridden by env DRIFT_WEBHOOK_URL
  webhook_timeout_s: 5.0
  auto_remediation_cooldown_s: 3600 # prevent a resolved incident reopening immediately

redis:
  url: ""                  # overridden by env REDIS_URL; empty = single-process mode
  socket_timeout_s: 0.5    # slow Redis degrades to local mode rather than blocking
  retry_interval_s: 5.0    # reconnection probe interval while Redis is down
  index_poll_interval_s: 5.0 # replicas re-check the shared index version this often
  drift_state_ttl_s: 604800  # idle expiry of shared drift state (7 days)

cache:
  enabled: true            # overridden by env QUERY_CACHE_ENABLED
  ttl_s: 3600              # cached embedding + top-k result lifetime

logging:
  level: "INFO"
  format: "json"

wandb:
  project: "rag-drift"
  entity: ""               # leave blank to use default W&B entity
